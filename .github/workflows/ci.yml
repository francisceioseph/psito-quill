name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: 3.47.4
  # O que o Quill compila e o que os testes abrem: o LibreOffice do sistema (o
  # motor), o cabeçalho do LibreOfficeKit, o Lua 5.4, o GoogleTest e o clang do
  # ffigen. O Ubuntu 24.04 tem o LibreOffice 24.2, o mesmo das medições. O
  # pacote de português faz o menu do motor sair em pt-BR, como a integração espera.
  BUILD_DEPS: >-
    libgtk-3-dev ninja-build cmake clang pkg-config
    libreoffice-writer libreofficekit-dev liblua5.4-dev libgtest-dev libclang-18-dev
    libreoffice-l10n-pt-br hunspell-pt-br fonts-liberation

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $BUILD_DEPS
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: The generated translations match the ARB files
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/gen
      - name: Unit and widget tests
        run: flutter test -j 2 -r failures-only test/
      - name: Native tests (GoogleTest)
        run: TEST_MEM=0 tool/native-test.sh
      - name: Build
        run: flutter build linux --release

  # O LibreOffice de verdade, numa tela virtual. O fechar-test.sh fecha a janela
  # pelo gerenciador de janelas, então o Openbox roda junto.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $BUILD_DEPS xvfb xauth openbox wmctrl dbus-x11 at-spi2-core
      - name: Dependencies
        run: flutter pub get
      - name: Integration (the real engine)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c '
            openbox >/dev/null 2>&1 &
            sleep 1
            dbus-run-session -- flutter test -d linux integration_test/ &&
            dbus-run-session -- tool/fechar-test.sh'

  # A versão sai dos commits desde a última tag (Conventional Commits): feat sobe
  # o minor, fix e perf o patch, BREAKING CHANGE o major. O commit da versão
  # volta para a main com o pubspec.yaml.
  release:
    needs: [check, integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.new_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag and publish the release
        run: >-
          npx --yes
          -p semantic-release@24.2.9
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/git@11.0.1
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: The tag, if this run made one
        id: new_tag
        run: |
          git fetch --tags --force
          tag="$(git tag --points-at HEAD 'v*' | head -1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  packages:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
