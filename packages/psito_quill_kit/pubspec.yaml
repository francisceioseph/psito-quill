name: psito_quill_kit
description: "O motor do Psito Quill: o LibreOfficeKit do sistema numa thread própria, ladrilhos como texturas e Lua 5.4 para plugins."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.3
  flutter: '>=3.47.0'

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^23.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: PsitoQuillKitPlugin
